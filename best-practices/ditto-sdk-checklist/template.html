<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ditto SDK Implementation Checklist</title>
  <style>
    /* ==========================================================================
       CSS Variables & Base Styles
       ========================================================================== */
    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #1a1f3a;
      --bg-tertiary: #252b4a;
      --text-primary: #e8eaf0;
      --text-secondary: #b4bbd0;
      --text-muted: #8a91a8;
      --accent-primary: #00d4ff;
      --accent-secondary: #4f46e5;
      --border-color: #2d3451;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.5);
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #4f46e5 100%);
      --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      padding: 20px;
      min-height: 100vh;
    }

    a {
      color: var(--accent-primary);
    }

    button {
      font: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    /* ==========================================================================
       Container & Layout
       ========================================================================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow-lg);
    }

    /* ==========================================================================
       Header Styles
       ========================================================================== */
    header {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 2px solid var(--border-color);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      padding: 8px 16px;
      border-radius: 24px;
      box-shadow: var(--shadow-sm);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 16px;
      transition: all var(--transition-fast);
    }

    .lang-btn:hover {
      color: var(--accent-primary);
      background: rgba(0, 212, 255, 0.1);
    }

    .lang-btn[aria-pressed="true"] {
      color: var(--accent-primary);
      background: rgba(0, 212, 255, 0.15);
    }

    .separator {
      color: var(--text-muted);
      font-weight: 300;
    }

    .metadata {
      color: var(--text-muted);
      font-size: 0.9em;
      margin-bottom: 12px;
    }

    .metadata code {
      font-family: var(--font-mono);
      font-size: 0.95em;
    }

    .intro {
      color: var(--text-secondary);
      margin-bottom: 20px;
      max-width: 860px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 600;
      transition: all var(--transition-fast);
    }

    .toolbar-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* ==========================================================================
       Progress Bar
       ========================================================================== */
    .progress-container {
      margin-top: 20px;
    }

    .progress-bar-bg {
      background: var(--bg-tertiary);
      height: 12px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .progress-bar {
      height: 100%;
      background: var(--gradient-primary);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
    }

    .progress-text {
      text-align: center;
      margin-top: 12px;
      font-size: 0.95em;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ==========================================================================
       Section Accordion
       ========================================================================== */
    .section {
      background: var(--bg-tertiary);
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition-normal);
    }

    .section:hover {
      box-shadow: var(--shadow-md);
    }

    .section-heading {
      font-size: 1.4em;
      font-weight: 600;
      margin: 0;
    }

    .section-header {
      width: 100%;
      padding: 20px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      color: var(--text-primary);
      font-size: 1em;
      font-weight: inherit;
      border: none;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(79, 70, 229, 0.05) 100%);
      border-left: 4px solid transparent;
      transition: all var(--transition-fast);
    }

    .section-header:hover {
      border-left-color: var(--accent-primary);
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(79, 70, 229, 0.1) 100%);
    }

    .section-title {
      flex: 1;
    }

    .section-number {
      color: var(--accent-primary);
      font-weight: 700;
      margin-right: 6px;
    }

    .section-progress {
      font-size: 0.6em;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .section-progress.done {
      color: var(--accent-primary);
    }

    .section-toggle {
      font-size: 0.85em;
      color: var(--accent-primary);
      transition: transform var(--transition-normal);
    }

    .section-header[aria-expanded="false"] .section-toggle {
      transform: rotate(-90deg);
    }

    /* ==========================================================================
       Checklist Items
       ========================================================================== */
    .item {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-fast);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item:hover {
      background: rgba(0, 212, 255, 0.02);
    }

    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    input[type="checkbox"] {
      flex-shrink: 0;
      margin-top: 2px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--accent-primary);
    }

    .item-title {
      font-size: 1.15em;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      line-height: 1.4;
      cursor: pointer;
    }

    .item-checkbox:checked + .item-title {
      color: var(--text-muted);
    }

    .item-details {
      margin-left: 38px;
    }

    .detail-section {
      margin-bottom: 16px;
    }

    .detail-heading {
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 8px;
      font-size: 0.95em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-content {
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .detail-content p {
      margin-bottom: 12px;
    }

    .detail-content p:last-child {
      margin-bottom: 0;
    }

    .detail-content ul {
      margin-bottom: 12px;
      list-style: none;
    }

    .detail-content ul:last-child {
      margin-bottom: 0;
    }

    .detail-content ul li {
      margin-bottom: 8px;
      padding-left: 28px;
      position: relative;
    }

    .detail-content ul li::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 10px;
      width: 6px;
      height: 6px;
      background: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
    }

    .detail-content strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .detail-content code,
    .guide-reference code {
      background: var(--bg-primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.9em;
      color: var(--accent-primary);
      border: 1px solid var(--border-color);
      overflow-wrap: anywhere;
    }

    .guide-reference {
      font-size: 0.9em;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .guide-label {
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* ==========================================================================
       Code Examples
       ========================================================================== */
    .code-example {
      margin-top: 16px;
      background: var(--bg-primary);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0, 212, 255, 0.05);
      border-bottom: 1px solid var(--border-color);
    }

    .code-label {
      font-size: 0.85em;
      font-weight: 600;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .code-toggle {
      background: transparent;
      border: 1px solid var(--accent-primary);
      color: var(--accent-primary);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 600;
      transition: all var(--transition-fast);
    }

    .code-toggle:hover {
      background: var(--accent-primary);
      color: var(--bg-primary);
    }

    .code-content {
      max-height: 500px;
      overflow: auto;
      padding: 16px;
    }

    .code-content pre {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.95em;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .code-content code {
      color: inherit;
    }

    /* ==========================================================================
       Floating Action Button
       ========================================================================== */
    .float-btn {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--gradient-primary);
      color: white;
      padding: 16px 24px;
      border-radius: 50px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
      font-weight: 600;
      font-size: 0.95em;
      transition: all var(--transition-normal);
      z-index: 1000;
    }

    .float-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.6);
    }

    .float-btn span:first-child {
      font-size: 1.3em;
    }

    /* ==========================================================================
       Responsive Design
       ========================================================================== */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 20px 16px;
        border-radius: 12px;
      }

      h1 {
        font-size: 1.8em;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .section-heading {
        font-size: 1.2em;
      }

      .section-header {
        padding: 16px;
      }

      .item {
        padding: 20px 16px;
      }

      .item-title {
        font-size: 1.05em;
      }

      .item-details {
        margin-left: 0;
      }

      .float-btn {
        bottom: 20px;
        right: 20px;
        padding: 14px 20px;
      }

      .float-btn-text {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }
    }

    /* ==========================================================================
       Print Styles
       ========================================================================== */
    @media print {
      :root {
        --bg-primary: #f4f5f8;
        --bg-secondary: #ffffff;
        --bg-tertiary: #ffffff;
        --text-primary: #000000;
        --text-secondary: #222222;
        --text-muted: #555555;
        --accent-primary: #1f3a93;
        --border-color: #cccccc;
      }

      body {
        background: white;
        padding: 0;
      }

      .container,
      .section {
        box-shadow: none;
      }

      h1 {
        background: none;
        -webkit-text-fill-color: currentColor;
        color: black;
      }

      .lang-switcher,
      .toolbar,
      .float-btn,
      .code-toggle,
      .section-toggle {
        display: none;
      }

      .item {
        break-inside: avoid;
      }

      .section-content,
      .code-content {
        display: block !important;
      }

      .code-content {
        max-height: none;
        overflow: visible;
      }

      .code-content pre {
        white-space: pre-wrap;
      }

      .highlight * {
        color: black !important;
        background: none !important;
      }
    }

    /* ==========================================================================
       Syntax Highlighting (Pygments, injected by build script)
       ========================================================================== */
    /* INJECT_PYGMENTS_CSS_HERE */

    .highlight {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1 data-i18n="title">Ditto SDK Implementation Checklist</h1>
        <div class="lang-switcher" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">ENG</button>
          <span class="separator" aria-hidden="true">/</span>
          <button type="button" class="lang-btn" data-lang="ja" aria-pressed="false">JPN</button>
        </div>
      </div>
      <div class="metadata">
        <span data-i18n="versionLabel">Version</span> {{VERSION}} |
        <span data-i18n="lastUpdatedLabel">Last Updated:</span> {{LAST_UPDATED}} |
        <span data-i18n="appliesToLabel">Applies to:</span> {{APPLIES_TO}}
      </div>
      <p class="intro" data-i18n-html="intro"></p>
      <div class="progress-container">
        <div class="progress-bar-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="global-progress-bg">
          <div class="progress-bar" id="global-progress"></div>
        </div>
        <div class="progress-text" aria-live="polite">
          <span id="completed-count">0</span> / <span id="total-count">0</span> <span data-i18n="completed">completed</span> (<span id="percent">0</span>%)
        </div>
      </div>
      <div class="toolbar">
        <button type="button" class="toolbar-btn" id="expand-all" data-i18n="expandAll">Expand all</button>
        <button type="button" class="toolbar-btn" id="collapse-all" data-i18n="collapseAll">Collapse all</button>
        <button type="button" class="toolbar-btn" id="reset-progress" data-i18n="resetProgress">Reset progress</button>
      </div>
    </header>

    <main id="sections-container">
      <!-- INJECT_SECTIONS_HERE -->
    </main>

    <a href="https://docs.ditto.live" class="float-btn" target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">📘</span>
      <span class="float-btn-text" data-i18n="officialDoc">Ditto Docs</span>
    </a>
  </div>

  <script>
    // ==========================================================================
    // Translation Data (injected by build script)
    // ==========================================================================
    const translations = /* INJECT_TRANSLATIONS_HERE */;

    const STATE_KEY = 'ditto-checklist-state-v2';
    const LANG_KEY = 'ditto-checklist-lang';
    let currentLang = 'en';

    // ==========================================================================
    // Storage (may be unavailable, e.g. in private windows or for file:// pages)
    // ==========================================================================

    function readStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {
        // Progress simply is not remembered.
      }
    }

    // ==========================================================================
    // Sections and code examples
    // ==========================================================================

    function setSectionExpanded(button, expanded) {
      button.setAttribute('aria-expanded', String(expanded));
      document.getElementById(button.getAttribute('aria-controls')).hidden = !expanded;
    }

    function setCodeVisible(button, visible) {
      button.setAttribute('aria-expanded', String(visible));
      document.getElementById(button.getAttribute('aria-controls')).hidden = !visible;
      button.textContent = visible ? translations[currentLang].hideCode : translations[currentLang].showCode;
    }

    // ==========================================================================
    // Progress
    // ==========================================================================

    function updateProgress() {
      const checkboxes = Array.from(document.querySelectorAll('.item-checkbox'));
      const total = checkboxes.length;
      const completed = checkboxes.filter(cb => cb.checked).length;
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

      document.getElementById('completed-count').textContent = String(completed);
      document.getElementById('total-count').textContent = String(total);
      document.getElementById('percent').textContent = String(percent);
      document.getElementById('global-progress').style.width = percent + '%';
      document.getElementById('global-progress-bg').setAttribute('aria-valuenow', String(percent));

      document.querySelectorAll('.section').forEach(section => {
        const boxes = Array.from(section.querySelectorAll('.item-checkbox'));
        const done = boxes.filter(cb => cb.checked).length;
        const label = section.querySelector('.section-progress');
        label.textContent = `${done} / ${boxes.length}`;
        label.classList.toggle('done', done === boxes.length);
      });

      const state = {};
      checkboxes.forEach(cb => {
        if (cb.checked) {
          state[cb.id] = true;
        }
      });
      writeStorage(STATE_KEY, JSON.stringify(state));
    }

    // ==========================================================================
    // Language
    // ==========================================================================

    function switchLanguage(lang) {
      const t = translations[lang];
      if (!t) {
        return;
      }
      currentLang = lang;
      document.documentElement.lang = lang;
      document.title = t.title;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
      });
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        el.innerHTML = t[el.dataset.i18nHtml];
      });

      document.querySelectorAll('.section').forEach((section, index) => {
        section.querySelector('.section-title').innerHTML = t.sections[index];
      });

      document.querySelectorAll('.item').forEach(item => {
        const index = Number(item.dataset.itemIndex);
        item.querySelector('.item-title').textContent = t.items[index];
        item.querySelector('.what-content').innerHTML = t.whatMeansSections[index];
        item.querySelector('.why-content').innerHTML = t.whyMattersSections[index];
      });

      document.querySelectorAll('.what-heading').forEach(el => { el.textContent = t.whatMeans; });
      document.querySelectorAll('.why-heading').forEach(el => { el.textContent = t.whyMatters; });
      document.querySelectorAll('.guide-label').forEach(el => { el.textContent = t.guideRef; });
      document.querySelectorAll('.code-label-text').forEach(el => { el.textContent = t.codeExample; });

      document.querySelectorAll('code[data-code-index]').forEach(code => {
        code.innerHTML = t.codeExamples[Number(code.dataset.codeIndex)];
      });
      document.querySelectorAll('.code-toggle').forEach(btn => {
        btn.textContent = btn.getAttribute('aria-expanded') === 'true' ? t.hideCode : t.showCode;
      });

      writeStorage(LANG_KEY, lang);
    }

    // ==========================================================================
    // Initialization
    // ==========================================================================

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const state = JSON.parse(readStorage(STATE_KEY) || '{}');
        Object.keys(state).forEach(id => {
          const checkbox = document.getElementById(id);
          if (checkbox && checkbox.classList.contains('item-checkbox')) {
            checkbox.checked = state[id] === true;
          }
        });
      } catch (e) {
        console.error('Failed to restore checklist progress:', e);
      }

      const savedLang = readStorage(LANG_KEY);
      switchLanguage(savedLang === 'ja' ? 'ja' : 'en');
      updateProgress();

      document.querySelectorAll('.item-checkbox').forEach(cb => cb.addEventListener('change', updateProgress));
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => switchLanguage(btn.dataset.lang));
      });
      document.querySelectorAll('.section-header').forEach(btn => {
        btn.addEventListener('click', () => setSectionExpanded(btn, btn.getAttribute('aria-expanded') !== 'true'));
      });
      document.querySelectorAll('.code-toggle').forEach(btn => {
        btn.addEventListener('click', () => setCodeVisible(btn, btn.getAttribute('aria-expanded') !== 'true'));
      });
      document.getElementById('expand-all').addEventListener('click', () => {
        document.querySelectorAll('.section-header').forEach(btn => setSectionExpanded(btn, true));
      });
      document.getElementById('collapse-all').addEventListener('click', () => {
        document.querySelectorAll('.section-header').forEach(btn => setSectionExpanded(btn, false));
      });
      document.getElementById('reset-progress').addEventListener('click', () => {
        if (window.confirm(translations[currentLang].resetConfirm)) {
          document.querySelectorAll('.item-checkbox').forEach(cb => { cb.checked = false; });
          updateProgress();
        }
      });
    });
  </script>
</body>
</html>
